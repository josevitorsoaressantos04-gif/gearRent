name: CD - Build, Push e Run no Docker

on:
  push:
    branches: [ "main" ]

jobs:
  docker-build-push-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Autenticar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Build e Push da Imagem do Banco PostgreSQL
      - name: Build & Push - Banco PostgreSQL
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile-db
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gearrent-db:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/gearrent-db:${{ github.sha }}

      # 2. Build e Push da Imagem do Back-end (Spring Boot)
      - name: Build & Push - Back-end
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gearrent-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/gearrent-backend:${{ github.sha }}

      # 3. Build e Push da Imagem do Front-end (Nginx)
      - name: Build & Push - Front-end
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile-frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gearrent-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/gearrent-frontend:${{ github.sha }}

      # 4. Inicializar os Contêineres no Docker via Docker Compose
      - name: Subir Aplicação no Docker
        run: |
          docker-compose down || true
          docker-compose up -d --build
          docker-compose ps