name: CD - Build, Push e Run no Docker teste

on:
  push:
    branches: [ "main" ]

jobs:
  docker-build-push-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      # 🔐 Passo de Autenticação no Docker Hub
      - name: Autenticar no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Build & Push do Back-end Java Spring Boot
      - name: Build & Push - Back-end
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/gearrent-backend:latest

      # 2. Build & Push do Front-end Nginx
      - name: Build & Push - Front-end
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile-frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/gearrent-frontend:latest

      # 3. Baixar Imagens e Subir Contêineres no Docker
      - name: Subir Aplicação no Docker
        run: |
          docker-compose down || true
          docker-compose pull
          docker-compose up -d
          docker-compose ps