name: CI - Back-end Java Spring Boot (Unit & E2E)

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'src/main/java/**'
      - 'src/test/java/**'
      - 'src/main/resources/application*.properties'
      - 'pom.xml'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  unit-and-e2e-tests:
    name: Testes Unitários, E2E e Build JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 1. Executar Testes Unitários (Domínio, Calculadora, JWT e UptimeRobot 30s)
        run: mvn test -Dtest=LocacaoCancellationTest,DomainAndServicesUnitTest

      - name: 2. Executar Testes End-to-End (E2E Multi-Tenant Completo & Healthcheck UP)
        run: mvn test -Dtest=GearRentE2ETest,GearRentApplicationTests

      - name: 3. Compilar Pacote JAR de Produção
        run: mvn package -DskipTests
