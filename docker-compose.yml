services:
  # Servidor de Banco de Dados PostgreSQL (com healthcheck ativado)
  postgres-db:
    image: postgres:16-alpine
    container_name: gearrent-db
    restart: always
    environment:
      POSTGRES_DB: gearrent
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gearrent"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Back-end Java 17 / Spring Boot 4.1.1
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gearrent-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-db:5432/gearrent
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgrespassword
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - JWT_SECRET=SuaChaveSecretaMuitoForteGearRent2026
    depends_on:
      postgres-db:
        condition: service_healthy

  # Front-end Nginx (Vanilla JS)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile-frontend
    container_name: gearrent-frontend
    restart: always
    ports:
      - "80:80"
      - "5500:80"
    depends_on:
      - backend

volumes:
  postgres_data: