spring.application.name=gearRent-test
spring.datasource.url=jdbc:h2:mem:gearrent_test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=chave-secreta-exclusiva-para-testes-automatizados-ci-cd-2026
jwt.emissor=gearrent
jwt.expiracao-minutos=120

spring.mail.host=localhost
spring.mail.port=2525
app.email.remetente=no-reply@gearrent.test
app.email.envio-habilitado=false
app.frontend-url=http://127.0.0.1:5500/src/main/resources/view/redefinir-senha.html
app.recuperacao-senha.expiracao-minutos=30
app.cors.origens=http://127.0.0.1:5500,http://localhost:5500

app.uptimerobot.habilitado=true
app.uptimerobot.intervalo-ms=30000
app.uptimerobot.atraso-inicial-ms=60000
app.uptimerobot.url=
app.uptimerobot.rate-limit.requisicoes-por-minuto=3
app.uptimerobot.health.rate-limit.requisicoes-por-minuto=10
app.uptimerobot.health.rate-limit.max-ips-cache=1000
