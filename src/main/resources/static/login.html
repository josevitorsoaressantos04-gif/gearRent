<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Acesse o sistema de locação de equipamentos GearRent.">
    <title>Entrar | GearRent</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
    <header>
        <nav class="navbar prototype-navbar" aria-label="Navegação principal">
            <div class="container">
                <a class="navbar-brand" href="index.html">GearRent</a>
                <div class="navbar-nav flex-row flex-wrap gap-2">
                    <a class="nav-link" href="index.html">Início</a>
                    <a class="nav-link" href="clientes.html">Clientes</a>
                    <a class="nav-link" href="equipamentos.html">Equipamentos</a>
                    <a class="nav-link" href="locacoes.html">Locações</a>
                    <a class="nav-link active" href="login.html" aria-current="page">Sair</a>
                </div>
            </div>
        </nav>
    </header>

    <main id="conteudo" class="container page-shell">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <section class="card">
                    <div class="card-body p-4 p-md-5">
                        <p class="eyebrow mb-2">Acesso ao sistema</p>
                        <h1 class="h2 mb-2">Entrar na GearRent</h1>
                        <p class="mb-4">Informe seu e-mail e sua senha.</p>

                        <form id="form-login">
                            <div class="mb-3">
                                <label class="form-label" for="email">E-mail</label>
                                <input class="form-control form-control-lg" id="email" name="email"
                                       type="email" autocomplete="username" required>
                            </div>
                            <div class="mb-4">
                                <label class="form-label" for="senha">Senha</label>
                                <input class="form-control form-control-lg" id="senha" name="senha"
                                       type="password" autocomplete="current-password" required>
                            </div>
                            <button class="btn btn-primary btn-lg p-3 w-100" type="submit">Entrar</button>
                        </form>
                        <p class="small mt-3 mb-0">Protótipo visual: qualquer e-mail e senha preenchidos continuam para a página inicial.</p>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script>
        document.querySelector("#form-login").addEventListener("submit", (evento) => {
            evento.preventDefault();
            window.location.href = "index.html";
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
