spring.application.name=gearRent
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gearrent_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
jwt.secret=${JWT_SECRET:chave-local-de-desenvolvimento-com-mais-de-32-caracteres}
jwt.emissor=gearrent
jwt.expiracao-minutos=120
spring.jpa.open-in-view=false

# E-mail (injetado exclusivamente via variáveis de ambiente)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.email.remetente=${MAIL_REMETENTE:no-reply@gearrent.local}
app.email.envio-habilitado=${EMAIL_ENVIO_HABILITADO:false}

# URL completa da página que recebe o link de redefinição de senha
app.frontend-url=${FRONTEND_URL:http://127.0.0.1:5500/src/main/resources/view/redefinir-senha.html}
app.recuperacao-senha.expiracao-minutos=30

# Origens do front-end autorizadas a chamar a API (separadas por vírgula)
app.cors.origens=${APP_CORS_ORIGENS:http://127.0.0.1:5500,http://localhost:5500,https://gearrent-1.onrender.com}

# Confia apenas nos cabeçalhos de proxy reverso interno (Render/Nginx) para obter o IP real do cliente
server.forward-headers-strategy=native

# UptimeRobot / Keep-Alive interno a cada 30 segundos (evita hibernação de 50s no Render)
app.uptimerobot.habilitado=${UPTIMEROBOT_HABILITADO:true}
app.uptimerobot.intervalo-ms=${UPTIMEROBOT_INTERVALO_MS:30000}
app.uptimerobot.atraso-inicial-ms=${UPTIMEROBOT_ATRASO_INICIAL_MS:5000}
app.uptimerobot.url=${UPTIMEROBOT_PING_URL:https://gearrent-eo3x.onrender.com/api/health}
app.uptimerobot.rate-limit.requisicoes-por-minuto=${UPTIMEROBOT_RATE_LIMIT_RPM:3}
app.uptimerobot.health.rate-limit.requisicoes-por-minuto=${HEALTH_RATE_LIMIT_RPM:10}
app.uptimerobot.health.rate-limit.max-ips-cache=${HEALTH_RATE_LIMIT_MAX_IPS:10000}
